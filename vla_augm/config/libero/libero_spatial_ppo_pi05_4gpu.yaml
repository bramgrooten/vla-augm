defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - env/libero_plus_ood@env.eval_ood
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# pi0.5 LIBERO-Spatial. 4x H100 Cluster A, collocated, data-parallel.
# Upstream: examples/embodiment/config/libero_spatial_ppo_openpi_pi05.yaml, on 4 GPUs not 8.
# max_epochs 500 per piRL paper (arXiv:2510.25889 Table 11); upstream ships 1000.
# Needs TORCHINDUCTOR_COMPILE_THREADS=1 + OMP_NUM_THREADS=1 (run_pi05_4gpu.sh);
# why: see 2-GPU pi0 config header.
# seed: actor shuffle + train-env resets; env workers offset per rank.
# env.eval seed stays 0 so eval conditions match across runs.
seed: 42

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rl_inf
    experiment_name: "libero_spatial_ppo_pi05_4gpu_lr5e-6_seed${seed}"
    logger_backends: ["wandb"]

  max_epochs: 500
  max_steps: -1

  only_eval: False
  # Deterministic eval (eval/*): fixed reset states, flow_ode denoising, and
  # eval_seed pinning the flow prior. Shares a grid with save_interval, as
  # runner_utils.check_progress requires. Kept as a cheap in-run canary (554 s
  # a pass) so a diverging arm shows up at epoch 25 instead of after 59 h.
  val_check_interval: 25
  eval_seed: 12345
  # Every 25 epochs: 12 snapshots over a 300-epoch arm, which is the curve
  # resolution. All evaluation that feeds the paper happens offline off these,
  # so a broken eval costs an eval rerun rather than the training run.
  save_interval: 25
  # OOD eval is disabled during training (env.eval_ood.enable) -- it is the
  # expensive pass (1455 s vs 554 s) and it hangs the rollout->actor handoff.
  # OOD numbers come from offline full-suite evals on the snapshots above.
  val_ood_check_interval: 25

  resume_dir: null
  ckpt_path: null
  # Write heavy checkpoints to scratch (set per-run in the launch
  # script); null keeps them beside the logs. Videos/wandb/tensorboard
  # stay under logger.log_path regardless.
  checkpoint_path: null
  # Keep every 25-epoch snapshot: 12 per arm x ~18.5 GB = ~220 GB per arm,
  # 120 inodes. Pruning existed to protect the PROJECT_ID inode quota, which
  # 1200 inodes across ten arms does not threaten.
  keep_only_last_checkpoint: False
  keep_checkpoint_interval: 25
  # No best_model: picking "best" needs an eval metric, and the metric that
  # decides anything is the offline full-suite score, not the in-run canary.
  save_best_checkpoint: False

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  # Exp 0(b): observation augmentation, SVEA-style (arXiv:2107.00644).
  # Arm is chosen on the command line, so all arms share one config:
  #   sbatch vla_augm/scripts/cluster_a/run_pi05_4gpu.sh 42 \
  #       algorithm.augmentation.placement=critic_only
  # placement: none       baseline, 1 VLM pass
  #            uniform    actor+critic both augmented, 1 VLM pass
  #            critic_only actor clean, critic fit on clean+aug, 2 VLM passes
  #            actor_only  actor augmented, critic fit on clean only, 2 VLM passes
  # bank_path: built by vla_augm/utils/build_overlay_bank.py from ImageNet Winter21
  # (19,167 synsets, ~13.0M images -- NOT the 21,841-synset fall11 release,
  # despite Cluster A naming the directory imagenet21k). 10 images per synset
  # = ~192k overlays, sharded across the 4 actor ranks so host memory holds one
  # 29 GB copy rather than one per rank. On top of that, crop_scale applies a
  # random resized crop + flip to every draw (as SVEA/MaDi do), so the overlay
  # distribution is far larger than the file count.
  augmentation:
    placement: none # options: none, uniform, critic_only
    # Which phases see augmented observations.
    #   updates-only  only the training forward (default). Rollouts and
    #                 evals stay clean, so the behaviour policy and the
    #                 reported success rates are unaffected.
    #   all           rollouts and evals augmented too. Expect worse, and
    #                 eval then measures success under overlay rather than
    #                 in-distribution. Saved videos still show the clean env
    #                 render; use vla_augm/utils/preview_augmentation.py instead.
    apply_during: updates-only # options: updates-only, all
    # When a fresh overlay image is drawn.
    #   random-per-angle  new image per camera and per draw (strongest)
    #   random            new image per draw, shared across cameras -- one
    #                     scene change seen from both viewpoints
    #   chunk             held for one action chunk
    #   episode           held for a whole episode
    # The training update sees a shuffled batch of independent timesteps, so
    # chunk and episode only bite on the rollout/eval path.
    sequence: random # options: random-per-angle, random, chunk, episode
    type: random_overlay # options: random_overlay, random_shift, random_overlay_shift
    # Augmentation family.
    #   random_overlay        blend a natural image (SVEA/MaDi). Photometric, so
    #                         it targets textures/lighting -- where pi0.5 already
    #                         sits at 86-89% and has little headroom.
    #   random_shift          pad and random-crop the OBSERVATION (DrQ/SVEA).
    #                         Geometric, so it targets Camera Viewpoints, where
    #                         pi0.5 collapses to 17%. Needs no bank.
    #   random_overlay_shift  both, overlay first.
    # NOTE shift_pad perturbs the observation; crop_scale above crops the
    # OVERLAY image. Different things, easy to confuse.
    shift_pad: 10 # px of replicate padding = max shift; DrQ uses 4px on 84px
    shift_per_view: True # cameras move independently, as physical cameras would
    # Border fill for the shift. replicate (default) extends edge pixels, as
    # DrQ does. constant pads with shift_pad_value (-1 = black) and so
    # introduces a border, which is itself a distribution shift the policy can
    # key off -- kept available as an ablation, not a default. reflect and
    # circular invent structure no camera motion would produce.
    shift_pad_mode: replicate # options: replicate, constant, reflect, circular
    shift_pad_value: -1.0 # constant mode only; [-1, 1] range, -1 = black
    alpha: 0.5 # SVEA and MaDi both use 0.5
    critic_aug_weight: 0.5 # SVEA beta; weight on the augmented critic term
    bank_path: /projects/PROJECT_ID/users/USER/overlay_banks/imagenet_winter21_10perclass.pt
    # Minimum crop area as a fraction of the overlay; null disables crop+flip.
    crop_scale: 0.3
    # cpu keeps the bank in host memory (see algorithm/augmentation.py).
    bank_device: cpu
    # View indices, openpi order (base_0_rgb, left_wrist_0_rgb,
    # right_wrist_0_rgb). LIBERO fills index 2 with a zero padding image that
    # LiberoInputs attention-masks off, so augment the two real cameras only;
    # "all" would waste a blend on the padding. [0] = base camera alone, the
    # closest match to a pure background swap.
    views: [0, 1]

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    seed: ${seed}
    rollout_epoch: 8
    total_num_envs: 64
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
  eval:
    # 104 x 5 = 520 episode slots for 500 (task, trial) pairs. Eval deals the
    # pairs round-robin over env world size (4) x pipeline_stage_num (2) = 8
    # pools of 63/62, and 13 envs x 5 epochs = 65 slots per pool covers every
    # pool. Slots past the end of a pool are skipped, not rerun, so nothing is
    # double-counted. total_num_envs must be divisible by 4 x 2.
    rollout_epoch: 5
    total_num_envs: 104
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    video_cfg:
      # Off by default: _finalize_video blocks on future.result(), so encoding
      # is serialized into the eval -- ~2.6 s per 242-frame 1280x1280 clip, 20
      # clips per eval point, doubled when a clean twin is written alongside an
      # augmented one. That is ~1-3% of total training time for something we can
      # regenerate on a MIG slice in 30 s (vla_augm/scripts/cluster_a/make_augm_videos.sh).
      # Flip to True when you want to watch rollouts.
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
      # Cameras to record. ["main", "wrist"] writes both side by side, which is
      # what the policy consumes; ["main"] is the single third-person view.
      views: ["main", "wrist"]
      # Record the augmented frames instead of the clean env render, so the
      # video shows what the policy sees. Independent draws from the same bank
      # and alpha as training -- same distribution, not the identical frame
      # (the policy's overlay is applied after the resize to 224).
      # bank_shards keeps a slice of the bank so every env worker does not hold
      # tens of GB. Leave bank_path null to record clean frames.
      augmentation:
        bank_path: null
        alpha: ${algorithm.augmentation.alpha}
        crop_scale: ${algorithm.augmentation.crop_scale}
        sequence: ${algorithm.augmentation.sequence}
        bank_shards: 32
        seed: ${seed}

  # LIBERO-Plus OOD eval (eval_ood/* in wandb). Defaults and the rationale for
  # the axis choice live in examples/embodiment/config/env/libero_plus_ood.yaml;
  # only suite-specific values are set here.
  eval_ood:
    task_suite_name: libero_spatial
    # Off during training: the OOD group's env workers construct fine (measured
    # 159 s for 10 envs, 43 s first reset) but the run then blocks forever in
    # actor.recv_rollout_trajectories. OOD scores come from offline full-suite
    # evals on the every-25 snapshots, which is where the paper's numbers were
    # always going to come from. Set True again once that hang is understood.
    enable: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 2

  model:
    model_path: "/scratch/USER/rl_inf/models/RLinf-Pi05-LIBERO-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 2048
  seed: ${seed}
  enable_offload: False

  model:
    model_path: "/scratch/USER/rl_inf/models/RLinf-Pi05-LIBERO-SFT"
    model_type: "openpi"
    num_action_chunks: 5 # interface for the env
    num_steps: 3
    add_value_head: True
    openpi:
      value_after_vlm: True
      # Flow-matching exploration for RL. flow_sde = fixed analytic noise
      # schedule (no learned params; entropy is forced to 0 so entropy_bonus
      # is a no-op). flow_noise = learned state-dependent std (real entropy,
      # ~2x train cost). noise_level scales flow_sde only. See
      # examples/embodiment/config/maniskill_ppo_openpi.yaml.
      noise_method: "flow_sde"
      joint_logprob: False # False for flow_sde, True for flow_noise

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    # LoRA adapters only (no effect when is_lora is off -- the group is not
    # created if no parameter name contains "lora_"). 10x the actor rate:
    # lora_B starts at exactly zero and the update is scaled by
    # lora_alpha / r, so a full-fine-tuning rate leaves the adapters barely
    # moving and the arm quietly reproduces the frozen one. 10x rather than
    # the 50-100x LoRA papers often use, because actor_only and uniform
    # both collapsed to ~0% at 5e-6 -- this policy is fragile and a
    # collapsed arm answers nothing.
    lora_lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # openpi does not support gradient checkpointing
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
