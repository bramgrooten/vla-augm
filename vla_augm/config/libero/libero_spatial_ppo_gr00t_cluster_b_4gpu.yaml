defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - env/libero_plus_ood@env.eval_ood
  - model/gr00t@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Four A100-40GB GPUs on Cluster B: collocated placement, data-parallel over 4.
# GR00T N1.5 counterpart of libero_spatial_ppo_pi05_cluster_b_4gpu, following the
# CI-tested tests/e2e_tests/embodied/libero_spatial_ppo_gr00t.yaml and the
# upstream recipe examples/embodiment/config/libero_goal_ppo_gr00t.yaml
# (64 envs, rollout_epoch 8, global batch 1024, update_epoch 1, lr 2e-5).
#
# Memory notes vs the pi0.5 config (same 40 GB constraint):
#   * Peak memory is NOT set by param count -- it is the Eagle2/Qwen3 VLM
#     lm_head logits (~5.15 GiB at micro_batch_size 32: [mb, seq, ~152k vocab]),
#     a tensor pi0.5's flow-matching head never materializes. With
#     PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False (forced on Cluster B: True
#     breaks CUDA-IPC), the caching allocator fragments over ~7 epochs until no
#     contiguous 5.15 GiB block remains -> CUDA OOM (job 5008707 died at ~1h50m,
#     only ~20 MB short, with ~7.7 GiB reserved-but-unallocated). micro_batch_size
#     16 halves that contiguous request (~2.6 GiB); global_batch_size stays 1024
#     so the RL math is unchanged (grad-accum granularity just doubles). Rollout
#     (~12.5 min) dominates each epoch, so the extra micro-batches cost little
#     wall time.
#   * rollout.enable_offload: True (gr00t e2e/upstream default) frees the
#     rollout model copy during the training update -- pi0.5 didn't need this.
#   * LIBERO-Plus OOD eval (eval_ood) enabled exactly as in the pi0.5 config;
#     LIBERO-Plus is installed in .venv-gr00t with the asset pack shared from
#     .venv-pi (vla_augm/scripts/cluster_b/install_libero_plus_gr00t.sh).
# Requires TORCHINDUCTOR_COMPILE_THREADS=1 and OMP_NUM_THREADS=1
# (set in run_gr00t_4gpu.sh).
seed: 42

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rl_inf
    experiment_name: "libero_spatial_ppo_gr00t_cluster_b_4gpu_lr2e-5_seed${seed}"
    logger_backends: ["wandb"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  # Deterministic eval (eval/*): fixed reset states, flow_ode denoising, and
  # eval_seed pinning the flow prior. Must share a grid with save_interval.
  val_check_interval: 20
  eval_seed: 12345
  # Save every 5 epochs: reserved-node jobs are capped at 6 h, so a frequent
  # last-checkpoint keeps wall-time losses small. 5 shares a grid with
  # val_check_interval/val_ood_check_interval (20), as runner_utils requires.
  save_interval: 5
  # OOD eval cadence. Matches val_check_interval so the in-distribution and
  # OOD curves share an x-grid (the ID-minus-OOD gap is the headline plot).
  val_ood_check_interval: 20

  resume_dir: null
  ckpt_path: null
  # Write heavy checkpoints to scratch (set per-run in the launch
  # script); null keeps them beside the logs. Videos/wandb/tensorboard
  # stay under logger.log_path regardless.
  checkpoint_path: null
  # Keep only the most recent checkpoint on disk during training, except
  # snapshots at every keep_checkpoint_interval epochs (implemented in
  # EmbodiedRunner._prune_old_checkpoints, so all runners/servers get it).
  keep_only_last_checkpoint: True
  keep_checkpoint_interval: 100

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    seed: ${seed}
    rollout_epoch: 8
    total_num_envs: 64
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
  eval:
    # 24 x 21 = 504 episode slots for 500 (task, trial) pairs. Eval deals the
    # pairs round-robin over env world size (4) x pipeline_stage_num (2) = 8
    # pools of 63/62, and 3 envs x 21 epochs = 63 slots per pool covers every
    # pool exactly. Slots past the end of a pool are skipped, not rerun.
    # total_num_envs must be divisible by 4 x 2.
    rollout_epoch: 21
    total_num_envs: 24
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    video_cfg:
      # Off by default: _finalize_video blocks on future.result(); see the
      # pi0.5 config for details. Flip to True to watch rollouts.
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

  # LIBERO-Plus OOD eval (eval_ood/* in wandb). Defaults and the rationale for
  # the axis choice live in examples/embodiment/config/env/libero_plus_ood.yaml;
  # only suite-specific values are set here.
  eval_ood:
    # LIBERO-Plus installed in .venv-gr00t with assets shared from .venv-pi
    # (vla_augm/scripts/cluster_b/install_libero_plus_gr00t.sh).
    # 5 axes x 25% subsample (fixed seed) every runner.val_ood_check_interval (20)
    # epochs -- see examples/embodiment/config/env/libero_plus_ood.yaml. The run
    # script loads ImageMagick + slims the env for the OOD worker group.
    enable: True
    task_suite_name: libero_spatial

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 2

  model:
    model_path: "/project/scratch/PROJECT_ID/vla_augm/rl_inf/models/RLinf-Gr00t-SFT-Spatial"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16 # was 32; halve to fit the VLM lm_head logits under fragmentation (see header note)
  global_batch_size: 1024
  seed: ${seed}
  enable_offload: False

  model:
    model_path: "/project/scratch/PROJECT_ID/vla_augm/rl_inf/models/RLinf-Gr00t-SFT-Spatial"
    model_type: "gr00t"
    add_value_head: True

  optim:
    lr: 2.0e-5
    value_lr: 2.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
