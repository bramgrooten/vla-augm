defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - env/libero_plus_ood@env.eval_ood
  - model/gr00t@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# GR00T N1.5 arm of the augmentation placement study (Exp 0(b)), on SNELLIUS
# (4x H100-80GB, collocated, data-parallel over 4).
#
# Port of libero_spatial_ppo_gr00t_cluster_b_4gpu_augm.yaml. Everything that is
# part of the protocol -- epochs, batch sizes, lr, env counts, eval cadence,
# snapshot grid -- is identical to the Cluster B arms, so the Cluster A runs stay
# comparable with the GR00T numbers already in the paper. Only the two model
# paths, the overlay bank path and the wandb experiment name change. The
# A100-40GB accommodations (rollout.enable_offload, full_shard,
# micro_batch_size 16) are kept even though an H100 has twice the memory:
# they are known to work, and this config's first job is to establish that
# GR00T runs on Cluster A at all.
#
# The pi0.5 arms of the same
# grid run on Cluster A; the two model families are only comparable if the
# protocol below matches, so the runner block is copied from the Cluster A
# protocol verbatim and every deviation is called out.
#
# Derived from libero_spatial_ppo_gr00t_cluster_b_4gpu.yaml -- see that file for
# the memory analysis behind micro_batch_size and rollout.enable_offload.
# Arms are selected on the command line; use
# vla_augm/scripts/cluster_b/run_gr00t_augm_arm.sh rather than hand-written overrides.
#
# Deviations from the Cluster A pi0.5 protocol, and why:
#   * max_epochs 300, matching Cluster A. This started at 250 for budget
#     reasons; the two arms that augment the actor (actor_only, uniform)
#     collapsed to zero success within ~15 epochs, so they are stopped at
#     epoch 100 and the ~76 GPU node-hours they would have burned confirming a
#     flat line pay for the remaining six arms to reach the full 300.
#     Snapshots stay on the 25-epoch grid, so all curves overlay directly.
#   * actor.micro_batch_size is lowered for the two-pass arms (see below).
#     global_batch_size is unchanged, so the optimisation is identical --
#     gradient accumulation absorbs the difference.
#   * env.eval_ood.enable: False, as on Cluster A. OOD eval during training is
#     expensive and hangs the run outright; all OOD numbers come from offline
#     full-suite evals over the saved snapshots.
seed: 52

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rl_inf
    experiment_name: "libero_spatial_ppo_gr00t_4gpu_lr2e-5_seed${seed}"
    logger_backends: ["wandb"]

  max_epochs: 300
  max_steps: -1

  only_eval: False
  # --- Cluster A protocol, do not change independently of the pi0.5 arms -----
  # In-distribution eval only, as a cheap divergence canary, on the same
  # 25-epoch grid as the kept snapshots.
  val_check_interval: 25
  eval_seed: 12345
  # Checkpoint every 5 epochs, but KEEP only every 25th. Cluster B's usable job
  # slots are far shorter than a 250-epoch arm, so a resume point every 25
  # epochs (~5 h) risks throwing away almost a whole segment when a job ends
  # early. Saving every 5 caps that loss at ~1 h.
  #
  # The extra saves are transient: keep_only_last_checkpoint prunes every
  # global_step_N except the newest, and keep_checkpoint_interval exempts the
  # multiples of 25 (embodied_runner.py::_prune_old_checkpoints). So what
  # survives on disk is exactly the 10 protocol snapshots plus whichever
  # intermediate one is currently newest -- the study's snapshot grid is
  # unchanged, and nothing but the resume point is retained off-grid.
  #
  # 25 % 5 == 0, which is the grid rule check_progress enforces
  # (rlinf/utils/runner_utils.py:44); it names this exact pattern.
  save_interval: 5
  keep_only_last_checkpoint: True
  keep_checkpoint_interval: 25
  # "Best" is decided offline from the full-suite OOD evals, so the runner must
  # not pick one for us: a best_model would compete with the snapshot grid.
  save_best_checkpoint: False
  # -------------------------------------------------------------------------

  resume_dir: null
  ckpt_path: null
  # Set per-run by the launch script to persistent project storage; these
  # snapshots must survive for offline eval weeks after the run ends.
  checkpoint_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  # Exp 0(b): observation augmentation. Values here are the *anchor* arm
  # (critic_only / random_overlay / alpha 0.5), which all three subsections of
  # the grid share; run_gr00t_augm_arm.sh overrides placement, type and alpha
  # per arm and nothing else. Never vary strength or bank per arm outside the
  # alpha sweep -- shrinking one arm's bank alone confounds that sweep.
  #
  # GR00T augments eagle_pixel_values directly. Eagle2 preprocesses with
  # image_mean/image_std 0.5 and rescale 1/255, i.e. uint8/255*2 - 1, which is
  # the same [-1, 1] channels-first range openpi hands pi0.5 -- so the blend is
  # numerically the same operation on both model families and the arms really
  # are comparable. tests/unit_tests/test_augmentation.py pins those constants.
  augmentation:
    placement: critic_only # options: none, uniform, critic_only, actor_only
    type: random_overlay # options: random_overlay, random_shift, random_overlay_shift
    apply_during: updates-only # options: updates-only, all
    sequence: random # options: random-per-angle, random, chunk, episode
    shift_pad: 10 # px of replicate padding = max shift; DrQ uses 4px on 84px
    shift_per_view: True
    shift_pad_mode: replicate # options: replicate, constant, reflect, circular
    shift_pad_value: -1.0 # constant mode only; [-1, 1] range, -1 = black
    alpha: 0.5
    critic_aug_weight: 0.5
    # The exact bank Cluster A used: ImageNet Winter21, 10 images per class,
    # 191,670 @ 224x224x3 uint8 (~26 GiB). Sharded across the 4 actor ranks, so
    # each holds ~6.5 GiB of host memory and the run still draws on all of it.
    bank_path: /projects/PROJECT_ID/users/USER/overlay_banks/imagenet_winter21_10perclass.pt
    crop_scale: 0.3
    bank_device: cpu
    # GR00T LIBERO has exactly two cameras (video.image, video.wrist_image), so
    # this is both of them -- matching the pi0.5 arms, which augment base and
    # wrist and leave pi0.5's unused third view slot alone.
    views: [0, 1]

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    seed: ${seed}
    rollout_epoch: 8
    total_num_envs: 64
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
  eval:
    # 20 x 25 = 500 episodes = every (task, trial) pair in the suite once.
    # total_num_envs must be divisible by the env world size (4).
    rollout_epoch: 25
    total_num_envs: 20
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

  eval_ood:
    # Off during training, exactly as on Cluster A: it is expensive, and there
    # it hangs the run outright. The OOD numbers -- the headline of the study
    # -- come from offline full-suite evals over the saved snapshots, which is
    # also what lets "best" be chosen after the fact.
    enable: False
    task_suite_name: libero_spatial

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  # Must be identical across all 8 arms: it changes batch composition per
  # update, so a mixed grid is a systematic confound, not a reseed.
  #
  # 1, NOT 2. Stage 2 is genuinely faster -- it cut the training rollout from
  # 11m01s to 9m47s (-11%) in smoke job 5036202 -- but it cannot run the
  # in-distribution eval. Stage 2 splits env.eval.total_num_envs 20 into two
  # stages of 10, and the receive plan requires each stage to divide the env
  # world size of 4 (rlinf/scheduler/worker/routing.py:167):
  #
  #     AssertionError: batch_size (10) must be divisible by src_world_size (4)
  #
  # Resizing the eval does not rescue it: the eval is 500 episodes = 10 tasks
  # x 50 trials, and 500 = 2^2 * 5^3 has no divisor divisible by 8, so no
  # (total_num_envs, rollout_epoch) pair with total_num_envs*rollout_epoch=500
  # survives a 2-way split on 4 GPUs. Any stage-2 eval would have to change the
  # episode set, which would break comparability with the pi0.5 arms -- a far
  # worse trade than ~9% of wall time. Training alone is fine at stage 2
  # (64 -> 32, divisible), but the setting is global.
  #
  # Note validate_cfg does not catch this: it checks only
  # total_num_envs // world // stage_num > 0 (rlinf/config.py:961), which 20
  # passes. The failure surfaces at the first eval, ~25 min into a run.
  pipeline_stage_num: 1

  model:
    model_path: "/scratch/USER/models/RLinf-Gr00t-SFT-Spatial"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # 16 for the one-pass arms (none, uniform); run_gr00t_augm_arm.sh lowers it
  # to 8 for the two-pass arms (critic_only, actor_only), whose second Eagle2
  # forward is retained for backward. global_batch_size is unchanged either
  # way, so every arm optimises exactly the same objective.
  micro_batch_size: 16
  global_batch_size: 1024
  seed: ${seed}
  enable_offload: False

  model:
    model_path: "/scratch/USER/models/RLinf-Gr00t-SFT-Spatial"
    model_type: "gr00t"
    add_value_head: True

  optim:
    lr: 2.0e-5
    value_lr: 2.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
