# pi0 (OpenPI) RL-trained checkpoint evaluated on standard LIBERO-Spatial (IND).
#
# In-distribution counterpart to libero_spatial_openpi_plus_eval.yaml (the OOD
# eval): same RL epoch-500 checkpoint and rollout protocol, but LIBERO_TYPE is
# standard (not plus), so the env loads the normal libero_spatial suite
# (10 tasks x 50 trials = 500 episodes). Deterministic: fixed reset states,
# flow_ode denoising (eval mode forces it), and eval_seed pinning the flow
# prior (see huggingface_worker._deterministic_eval_rng).
#
# NOTE: launches eval_embodied_agent.py DIRECTLY, skipping evaluations/run_eval.sh
# (its setup_sim_env grows the env; see the eval sbatch's MAX_ARG_STRLEN note).
defaults:
  - env/libero_spatial@env.eval
  - model/pi0@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rl_inf
    experiment_name: "libero_spatial_ind_openpi_eval"
    logger_backends: ["wandb"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  # Deterministic eval: pins the flow-matching prior x_T so a metric change
  # reflects the policy, not RNG (huggingface_worker._deterministic_eval_rng).
  eval_seed: 12345
  # RL-trained pi0 checkpoint (the spatial run that resumed to epoch 500) — same
  # path as the OOD eval config, proven to strict-load with add_value_head.
  ckpt_path: "/scratch/USER/pi0_ckpts/pi0_spatial_rl_step500.pt"

env:
  group_name: "EnvGroup"

  eval:
    # Standard libero_spatial: 10 tasks x 50 trials = 500 (task, trial) pairs.
    # 26 envs x 20 epochs = 520 episode slots. Eval deals the pairs round-robin
    # over env world size (1) x pipeline_stage_num (2) = 2 pools of 250, and 13
    # envs x 20 epochs = 260 slots per pool covers both; slots past the end of a
    # pool are skipped, not rerun. 26 stays under the ~32-EGL-env-per-H100
    # ceiling. (1-GPU standalone eval; training-time eval uses 104 envs on 4.)
    rollout_epoch: 20
    total_num_envs: 26
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 2

  model:
    model_path: "/scratch/USER/rl_inf/models/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    num_action_chunks: 5
    # The RL checkpoint carries value_head.* keys (PPO critic); build the head so
    # the strict load_state_dict matches. It is unused during action rollout.
    add_value_head: True
