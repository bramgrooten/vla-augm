# Cluster B port of libero_spatial_plus_video_pi05_eval.yaml -- recording round 3.
#
# WHY A THIRD ROUND. The round-2 clips shipped in vla_augm/supplementary_videos/
# were recorded on Cluster A while its LIBERO-Plus asset tree was incomplete, so
# the textures, lighting and layout axes rendered an UNPERTURBED scene while the
# burnt-in overlay still read "table 1" / "light 10". The tell is quantitative:
# those clips differ from the in-distribution clip by a mean absolute pixel
# delta of ~5, where a real texture perturbation measures 43-52 (see
# vla_augm/results/texture_debug/, rendered on this machine).
#
# Cluster B's assets are complete -- both scenes/ph/ and scenes/phs/ are present
# in libero_plus_assets.sqfs -- which is why the re-record happens here.
#
# WHAT CHANGED FROM THE SNELLIUS CONFIG. Only paths and the logger backend.
# The task list, seed, horizon, camera views and env shape are byte-identical,
# so round 3 is comparable to round 2 clip for clip. PI05_CKPT and VIDEO_DIR
# come from the environment; vla_augm/scripts/cluster_b/record_supplementary_videos.sh
# sets both.
#
# Video reel: the best pi0.5 arm (critic_only / random_overlay / alpha 0.5) on
# 50 LIBERO-Plus tasks, ten per visual axis, five it solved at epoch 300 and
# five it did not. For the paper's qualitative figure.
#
# Not a scoring run. The 50 tasks are a deliberately unrepresentative slice
# (half of them preselected failures), so its success rate means nothing and
# must never be quoted as an OOD number -- vla_augm/results/ood_full/ has those.
#
# ONE env, fifty rollout epochs. RecordVideo flushes once per rollout epoch per
# env worker (env_worker.py:1358, inside the epoch loop), writing
# seed_<n>/step<k>.mp4. With a single env each epoch is exactly one episode, so
# step<k> is the k-th task of task_id_filter and the clips come out one per
# task instead of one per epoch-of-32. vla_augm/analyze/name_video_clips.py then
# renames them to <axis>_task<id>_<ok|fail>.mp4 from the per-episode dump.
#
# The task list is generated, not hand-written: vla_augm/analyze/pick_video_tasks.py
# reads this arm's own ep300 sweep so "solved" means this checkpoint on this
# task. Regenerate with that script if the sweep is ever redone.
defaults:
  - env/libero_spatial@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # Hardware rank 0 only -- ONE env process, which everything downstream
    # depends on: one episode per rollout epoch, one clip per episode, so
    # step<k>.mp4 is the k-th task of task_id_filter and name_video_clips.py
    # can join clips to the episode dump positionally.
    #
    # The Cluster A config says "all" and means the same thing there, because its
    # sbatch gets a single GPU. It cannot be reused verbatim here: Cluster B's
    # gpu partition is node-exclusive, so this job is allocated all four A100s
    # whatever --gpus asks for (sacct on 5194108: gres/gpu=4 against --gpus=1),
    # and RLinf counts accelerators through NVML, which reports physical devices
    # and ignores CUDA_VISIBLE_DEVICES. "all" therefore becomes four env
    # processes and total_num_envs: 1 fails the divisibility assert in
    # validate_embodied_cfg. The other three GPUs idle; at ~1 h of recording
    # that is the cheap way out, where reshaping the run around four envs would
    # change what each clip contains.
    env,rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rl_inf
    experiment_name: "libero_spatial_plus_video_pi05_cluster_b_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  eval_seed: 12345
  # The critic_only / overlay / alpha0.5 seed-52 arm at epoch 300 -- the best
  # OOD arm in the table (avg_5axes 0.823 against the none arm's 0.740).
  ckpt_path: ${oc.env:PI05_CKPT}

env:
  group_name: "EnvGroup"

  eval:
    libero_variant: plus
    # One episode per rollout epoch, one video per episode. 50 epochs = the 50
    # tasks below, in this order.
    rollout_epoch: 80
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: True
    # 320, matching this arm's OOD sweep, so a clip's outcome is the same
    # success_once the table reports rather than a shorter-horizon variant.
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 320
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    # Ten per axis: textures, lighting, layout, camera, noise. Five solved at
    # ep300 and five not, per axis, and each axis pinned to its OWN base task so
    # the figure spans five manipulation tasks rather than repeating one.
    # Generated by vla_augm/analyze/pick_video_tasks.py.
    task_id_filter: [0, 1, 2, 3, 4, 5, 18, 20, 30, 32, 35, 39, 62, 67, 240, 257, 609, 610, 612, 614, 616, 618, 691, 693, 709, 713, 714, 725, 729, 735, 736, 737, 1375, 1377, 1379, 1380, 1382, 1383, 1419, 1420, 1426, 1431, 1486, 1488, 1491, 1492, 1512, 1517, 1725, 1727, 1728, 1729, 1730, 1731, 1732, 1750, 1850, 1871, 1900, 1907, 1908, 1910, 1946, 1947, 2111, 2112, 2113, 2114, 2115, 2116, 2117, 2134, 2136, 2146, 2178, 2220, 2259, 2273, 2277, 2399]
    video_cfg:
      save_video: True
      info_on_video: True
      # Show the running reward total instead of the per-step reward.
      # LIBERO pays a single +1 on the success frame -- one frame at
      # 30 fps, ~33 ms -- which is genuinely hard to catch when watching
      # and invisible in a still. The total steps to 1 and stays there,
      # so a clip reads as a success at any point after the grasp lands.
      cumulative_reward_on_video: True
      # NO extra_info_on_video. Recording with it hung the env worker before the
      # first rollout epoch -- job 25824230 timed out having written nothing,
      # while the identical run with save_video False finished in 8 min (job
      # 25824231). The training config, which has produced ~19k clips, never
      # sets this key. The success label therefore lives in the filename only.
      # $HOME, not scratch: these are paper figures and scratch is purged on a
      # ~14-day retention.
      video_base_dir: ${oc.env:VIDEO_DIR}
      views: ["main", "wrist"]
      # Clean frames. The policy sees augmentation only during updates, never at
      # eval, so an augmented reel would not show what was actually evaluated.
      augmentation:
        bank_path: null

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  # 1: with a single env there is nothing to split two ways.
  pipeline_stage_num: 1

  model:
    model_path: "/project/scratch/PROJECT_ID/vla_augm/rl_inf/models/RLinf-Pi05-LIBERO-SFT"
    model_type: "openpi"
    num_action_chunks: 5
    num_steps: 3
    # True: an RL checkpoint carries value_head.* keys and the eval load is a
    # strict load_state_dict.
    add_value_head: True
    openpi:
      value_after_vlm: True
