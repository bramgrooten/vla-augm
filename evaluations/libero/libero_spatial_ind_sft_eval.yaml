# pi0 (OpenPI) SFT BASELINE evaluated on standard LIBERO-Spatial (IND).
#
# In-distribution counterpart to libero_spatial_sft_plus_eval.yaml (the OOD SFT
# baseline): same protocol as libero_spatial_ind_openpi_eval.yaml but with no RL
# checkpoint (runner.ckpt_path: null), so it is the pre-RL reference point for
# the RL-trained epoch-500 IND eval. Deterministic (eval_seed pins flow prior).
#
# NOTE: launches eval_embodied_agent.py DIRECTLY, skipping evaluations/run_eval.sh
# (its setup_sim_env grows the env; see the eval sbatch's MAX_ARG_STRLEN note).
defaults:
  - env/libero_spatial@env.eval
  - model/pi0@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rl_inf
    experiment_name: "libero_spatial_ind_sft_eval"
    logger_backends: ["wandb"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  # Deterministic eval: pins the flow-matching prior x_T.
  eval_seed: 12345
  # SFT baseline: no RL checkpoint. When ckpt_path is null the rollout worker
  # uses the SFT weights from rollout.model.model_path (huggingface_worker.py:142).
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    # Standard libero_spatial: 10 tasks x 50 trials = 500 pairs. 26 envs x 20
    # epochs = 520 slots, dealt as 1 GPU x pipeline_stage_num (2) = 2 pools of
    # 250 with 260 slots each; slots past the end of a pool are skipped.
    rollout_epoch: 20
    total_num_envs: 26
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 2

  model:
    model_path: "/scratch/USER/rl_inf/models/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    num_action_chunks: 5
    # No RL checkpoint loaded, so the SFT model has no value head; don't build one.
    add_value_head: False
