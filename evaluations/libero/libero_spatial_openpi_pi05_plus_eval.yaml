# pi0.5 (OpenPI) on LIBERO-Plus (OOD). Results log to wandb as eval/*.
#
# ckpt_path below is null = SFT base. Set it (+ add_value_head) to score RL.
# LIBERO-Plus selected via LIBERO_TYPE=plus + LIBERO_SUFFIX (eval sbatch, or
# env.eval.libero_variant below).
#
# NOTE: with LIBERO_TYPE=plus the env ignores task_suite_name and enumerates the
# whole LIBERO-Plus benchmark (all base suites x 7 OOD axes), not spatial only.
# Despite the filename this is a full-benchmark sweep.
defaults:
  - env/libero_spatial@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rl_inf
    experiment_name: "libero_spatial_plus_openpi_pi05_eval"
    logger_backends: ["wandb"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  # null evaluates the SFT base model. Point at a
  # .../checkpoints/global_step_<N>/actor/model_state_dict/full_weights.pt
  # to score an RL-trained checkpoint instead (then set add_value_head below).
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    # Redundant with LIBERO_TYPE=plus env var; kept so the config is self-describing.
    libero_variant: plus
    # Full-suite eval: LIBERO-Plus (all) has 2402 tasks. The eval reset pool is
    # task-major interleaved, so the first 2402 draws = one trial per task. With
    # 32 envs, one epoch runs one episode per env (32 trajectories), so
    # ceil(2402/32)=76 epochs sweep every task once. Raise for more trials/task;
    # if you change total_num_envs, recompute this as ceil(2402/total_num_envs).
    rollout_epoch: 76
    # All envs run on one GPU (32 EGL/mujoco subprocess envs per H100). Do not
    # raise past ~32 here — see the eval sbatch's MAX_ARG_STRLEN note.
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 320
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      # Off for the full 2432-episode sweep — saving that many videos floods the
      # shared project disk. Flip to True (and drop rollout_epoch) to inspect rollouts.
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 2

  model:
    model_path: "/scratch/USER/rl_inf/models/RLinf-Pi05-LIBERO-SFT"
    model_type: "openpi"
    num_action_chunks: 5
    num_steps: 3
    # False for the SFT base, which has no critic. Set True (and set
    # runner.ckpt_path) when scoring an RL checkpoint: it carries value_head.*
    # keys, so the head must exist for the strict load_state_dict to match.
    add_value_head: False
    openpi:
      value_after_vlm: True
